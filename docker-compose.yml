name: vestis-wardrobe

services:
  wardrobe:
    build: .
    ports: ["127.0.0.1:${WARDROBE_PORT:-8002}:8000"]
    environment:
      DB_HOST: wardrobe-db
      DB_PORT: "5432"
      DB_NAME: wardrobe_db
      DB_USER: ${DB_USER:-vestis}
      DB_PASSWORD: ${DB_PASSWORD:?Copy .env.example to .env and set DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY:?Set the same SECRET_KEY as auth in .env}
      ALGORITHM: HS256
      REDIS_URL: redis://wardrobe-redis:6379/0
      ML_TASKS_QUEUE: ${ML_TASKS_QUEUE:-ml_tasks}
      ML_SERVICE_TOKEN: ${ML_SERVICE_TOKEN:?Set the same ML_SERVICE_TOKEN as ML in .env}
      EMBEDDING_DIM: "512"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-vestis}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
      MINIO_BUCKET: ${MINIO_BUCKET:-wardrobe-photos}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8002}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173,http://localhost:8080}
      DEBUG: "false"
    depends_on:
      wardrobe-db: {condition: service_healthy}
      wardrobe-redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    networks:
      default:
      vestis:
        aliases: [outfit_wardrobe_api]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 30s
    restart: unless-stopped

  wardrobe-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${DB_USER:-vestis}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: wardrobe_db
    volumes: [wardrobe-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  wardrobe-redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes: [wardrobe-redis-data:/data]
    networks:
      default:
      vestis:
        aliases: [vestis-wardrobe-redis]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z@sha256:b6bfe7239bfc83fb90d31612d9704d86039dd714f7904b3f1ad68f211e602372
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-vestis}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?Set MINIO_SECRET_KEY in .env}
    volumes: [photos:/data]
    networks:
      default:
      vestis:
        aliases: [vestis-wardrobe-minio]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

networks:
  vestis:
    external: true
    name: ${VESTIS_NETWORK:-vestis-services}

volumes:
  wardrobe-data:
  wardrobe-redis-data:
  photos:
